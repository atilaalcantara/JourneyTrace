server { listen 80; server_name _; root /usr/share/nginx/html; index index.html; add_header X-Content-Type-Options nosniff; add_header Referrer-Policy no-referrer; add_header X-Frame-Options DENY; location = /index.html { add_header Cache-Control "no-cache"; } location / { try_files $uri $uri/ /index.html; } location ~* \.(js|css|svg|woff2)$ { expires 1y; add_header Cache-Control "public, immutable"; gzip on; } }
