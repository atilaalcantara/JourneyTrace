# Install this server block in the existing nginx-proxy configuration after TLS is issued.
upstream journeytrace_app {
    server journeytrace:80;
}

server {
    listen 443 ssl;
    http2 on;
    server_name journeytrace.atilaalcantara.com;

    ssl_certificate /etc/nginx/certs/live/journeytrace.atilaalcantara.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/journeytrace.atilaalcantara.com/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location / {
        proxy_pass http://journeytrace_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
