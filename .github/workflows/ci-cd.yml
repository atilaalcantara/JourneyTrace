name: CI and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: journeytrace-production
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/journeytrace

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  publish:
    name: Publish container image
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: image
        run: echo "value=${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.image.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Deploy to production
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      DEPLOY_CONFIG: ${{ secrets.DEPLOY_CONFIG }}
      DEPLOY_PATH: /home/ubuntu/apps/journeytrace
      IMAGE: ${{ needs.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure SSH
        run: |
          config_file="$RUNNER_TEMP/deploy-config.json"
          printf '%s' "$DEPLOY_CONFIG" > "$config_file"
          deploy_host="$(jq -er '.host' "$config_file")"
          deploy_user="$(jq -er '.user' "$config_file")"
          install -m 700 -d ~/.ssh
          jq -er '.ssh_private_key' "$config_file" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          jq -er '.known_hosts' "$config_file" > ~/.ssh/known_hosts
          jq -er '.ghcr_pull_token' "$config_file" > "$RUNNER_TEMP/ghcr-pull-token"
          chmod 600 "$RUNNER_TEMP/ghcr-pull-token"
          rm -f "$config_file"
          {
            echo "DEPLOY_HOST=$deploy_host"
            echo "DEPLOY_USER=$deploy_user"
          } >> "$GITHUB_ENV"
      - name: Install deployment files
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          scp deploy/docker-compose.prod.yml deploy/deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
      - name: Authenticate server to GitHub Container Registry
        run: |
          cat "$RUNNER_TEMP/ghcr-pull-token" | \
            ssh "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io --username '${{ github.repository_owner }}' --password-stdin"
          rm -f "$RUNNER_TEMP/ghcr-pull-token"
      - name: Update JourneyTrace
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && chmod +x deploy.sh && JOURNEYTRACE_IMAGE='$IMAGE' ./deploy.sh"
